<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ورود به پنل مدیریت اسباب بازی متمنی</title>
    <!-- انتقال فوری به پنل مدیریت -->
    <script>
      // بررسی و انتقال فوری به ریشه با هش #admin یا بارگذاری SPA
      window.location.replace('/#admin');
    </script>
    <meta http-equiv="refresh" content="0; url=/#admin" />
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        text-align: center;
        direction: rtl;
      }
      .loader {
        font-size: 3rem;
        margin-bottom: 16px;
        animation: spin 1.2s infinite ease-in-out;
      }
      @keyframes spin {
        0% { transform: scale(0.9); }
        50% { transform: scale(1.15) rotate(10deg); }
        100% { transform: scale(0.9); }
      }
      a {
        color: #38bdf8;
        text-decoration: none;
        margin-top: 14px;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div class="loader">⚙️🔐</div>
    <h2>در حال انتقال به پنل مدیریت اسباب بازی متمنی...</h2>
    <p>لطفاً چند لحظه شکیبا باشید.</p>
    <a href="/#admin">اگر خودکار منتقل نشدید، اینجا کلیک کنید</a>
  </body>
</html>
